org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# AGP 8.7.2 was tested up to compileSdk 35 — 36 builds and runs fine in practice (Play now
# requires targetSdk 36 for new submissions), this just silences the "untested combination"
# warning. Revisit once an AGP release explicitly certifies 36.
android.suppressUnsupportedCompileSdk=36
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
# KSP2 stays disabled in Phase 1 — Hilt's KSP processor at 2.53 has known rough edges with
# KSP2 + Kotlin 2.1.x. Revisit once Hilt ships clean KSP2 support.
ksp.useKSP2=false
